<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waffle Empire Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Cookie&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf3f1;--line:#f0e2de;--pink:#e4b4a8;--head:#9b5546;--brown:#ac6350;--ink:#000;--card:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#faf3f1;--ink:#000}}
:root[data-theme="dark"]{--bg:#faf3f1;--ink:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:500;
background-image:linear-gradient(45deg,transparent 46%,var(--line) 46%,var(--line) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--line) 46%,var(--line) 54%,transparent 54%);background-size:44px 44px}
header{position:relative;text-align:center;padding:34px 16px 6px}
header h1{font-family:'Cookie','Brush Script MT',cursive;font-weight:400;color:var(--head);font-size:clamp(46px,9vw,80px);margin:0;line-height:1}
header p{margin:2px 0 0;letter-spacing:.25em;text-transform:uppercase;color:var(--brown);font-size:13px}
.c{position:absolute;top:0;width:clamp(70px,14vw,140px);mix-blend-mode:multiply}.tl{left:0}.tr{right:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 12px}
h3.tag{font-family:'Cookie',cursive;font-weight:400;color:var(--head);text-align:center;font-size:30px;margin:26px 0 0}
.menu{display:grid;grid-template-columns:repeat(4,1fr);margin:10px 0 28px}
article{padding:6px 14px 10px;border-left:2px solid var(--brown)}
article:first-child{border-left:0}
.pic{display:block;width:100%;max-width:260px;margin:0 auto;mix-blend-mode:multiply}
article h2{font-family:'Cookie',cursive;font-weight:400;color:var(--head);text-align:center;font-size:clamp(30px,3.2vw,40px);margin:8px 0 14px;line-height:1}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0;font-size:clamp(16px,1.6vw,19px);line-height:1.2}
li span{flex:1}li small{display:block;font-size:.78em;font-weight:500}
li b{font-weight:600;white-space:nowrap}
.pot{display:block;width:150px;margin:10px auto 0;mix-blend-mode:multiply}
footer{background:var(--brown);border-radius:60% 40% 0 0/40px 40px 0 0;height:56px;margin-top:10px}
@media(max-width:900px){.menu{grid-template-columns:repeat(2,1fr);row-gap:12px}article:nth-child(odd){border-left:0}}
@media(max-width:560px){.menu{grid-template-columns:1fr}article{border-left:0;border-top:2px solid var(--brown)}article:first-child{border-top:0}}
</style></head><body>
